# metcom_merra2.yaml —— MERRA2 反演参数配置
# 对应原 MATLAB: 03_DataProcessing/METCOM_MERRA2/MERRA2.mlapp 界面参数
# 注意: MERRA2 为一天一 NC 文件（含 4 个 6h 时次），空间分辨率 0.5°x0.625°
#       原代码从比湿反算相对湿度（q->RH），并修剪 NaN 层

# Data Path —— 数据根目录（内含 yyyy 年子文件夹）
data_path: "E:/DATA/MERRA2"

# Output Path —— 反演结果输出目录
output_path: "output_Merra2"

# OutPut Type —— 输出格式: txt | mat | dat
output_format: txt

# Stations List —— 站点列表文件（name lat lon h，正高）
site_file: "bth_0125_orthometric.txt"

# Start time / End time —— 时间范围（YYYYMMDD 或 YYYYMMDDHH）
start_time: "20240101"
end_time: "20240102"

# Spatial resolution —— 空间分辨率（纬度, 经度），度；MERRA2 为 0.5x0.625
spatial_resolution: [0.5, 0.625]

# Time resolution —— 时间分辨率: 6h（00/06/12/18 四时次）
time_resolution: "6h"

# Parallel pool —— 站点级并行（joblib）
parallel: false

n_jobs: null

# EGM2008 高程改正文件（0.5x0.625° 版）
egm_file: null
