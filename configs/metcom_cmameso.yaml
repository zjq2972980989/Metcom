# metcom_cmameso.yaml —— CMA-MESO 反演参数配置
# 对应原 MATLAB: 03_DataProcessing/METCOM_CMAMESO/CMAMESO.mlapp 界面参数
# 注意: CMAMESO 原始数据为 GRIB2（3 变量分文件），需先转换为 NC
#       （原版依赖 GribToNcConverter_cfgrib.exe，Python 版改用 cfgrib 内联转换）

# Data Path —— 转换后 NC 数据根目录（内含 yyyyMMdd 日文件夹）
data_path: "E:/DATA/CMAMESO_nc"

# Output Path —— 反演结果输出目录
output_path: "output_CMAMESO"

# OutPut Type —— 输出格式: txt | mat | dat
output_format: txt

# Stations List —— 站点列表文件（name lat lon h，正高）
site_file: "bth_0125_orthometric.txt"

# Start time / End time —— 时间范围（YYYYMMDD 或 YYYYMMDDHH）
start_time: "20250601"
end_time: "20250602"

# Spatial resolution —— 空间分辨率（纬度, 经度），度；CMA-MESO 为 0.03
spatial_resolution: [0.03, 0.03]

# Time resolution —— 时间分辨率: 3h
time_resolution: "3h"

# Parallel pool —— 站点级并行（joblib）
parallel: false

n_jobs: null

# EGM2008 高程改正文件（0.03° 版）
egm_file: null

# GRIB2 预转换选项（可选回退；默认直读 GRIB2，无需预转换。
# 仅当需要 NC 中间产物或当前环境无法解码 GRIB2 时启用）（可选回退；默认直读 GRIB2，无需预转换。
# 仅当需要 NC 中间产物或当前环境无法解码 GRIB2 时启用）
grib2:
  # 是否启用预转换（默认 false = Python 直读 GRIB2）
  enabled: false
  # 原始 GRIB2 数据根目录
  raw_path: "E:/DATA/CMAMESO_grib"
  # 转换中间目录（对应原版 tempTransData）
  temp_dir: "tempTransData"
