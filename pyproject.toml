[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metcom"
version = "3.1.0"
description = "METCOM - 多源再分析气象资料反演 ZTD/PWV（MATLAB ver3.1 的 Python 迁移版）"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "click>=8.1",
    "joblib>=1.2",
    "tqdm>=4.65",
    "requests>=2.28",
    "cdsapi>=0.7",
    "cfgrib>=0.9.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "cartopy>=0.21", "geopandas>=0.13", "shapely>=2.0"]
# GUI 图形化工作台：PySide6（窗口）+ pyqtgraph（曲线/散点，1443 站点流畅拖动缩放）
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
# eccodes（可选替代）：默认使用包内内嵌的 eccodes 运行时
# （metcom/libs/eccodes-jpeg/），如需替换可用 conda 版并设 METCOM_ECCODES_DIR
eccodes-alt = ["findlibs<1"]
dev = ["pytest>=7.0"]

[project.scripts]
metcom = "metcom.cli:cli"

[tool.setuptools.packages.find]
include = ["metcom*"]

[tool.setuptools.package-data]
"metcom" = ["libs/eccodes-jpeg/*.dll", "libs/eccodes-jpeg/eccodes/*",
            "libs/eccodes-jpeg/gribapi/*"]
